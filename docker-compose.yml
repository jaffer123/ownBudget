services:
  app:
    build: .
    container_name: ownbudget-app
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=localhost
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_NAME=ownbudget
    # depends_on:
    #   - mysql-db
    restart: always

  mysql-db:
    image: mysql:8
    container_name: ownbudget-mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: ownbudget
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    restart: always

volumes:
  db_data:
