name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nodejs

    steps:
      # Step 1: Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # # Step 4: Run lint
      - name: Run linter
        run: npm run lint

      # # Step 5: Run tests
      # - name: Run tests
      #   run: npm test

      # # Step 6: Build (optional, if applicable)
      # - name: Build project
      #   run: npm run build
