name: React.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./reactjs

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js (v18 LTS)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: reactjs/package-lock.json

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # # Step 4: Lint (optional)
      # - name: Run linter
      #   if: always()
      #   run: npm run lint --if-present

      # # Step 5: Run tests (optional)
      # - name: Run tests
      #   if: always()
      #   run: npm test --if-present -- --watchAll=false

      # Step 6: Build project
      - name: Build project
        run: npm run build

      # Step 7: Upload build artifacts (optional)
      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: reactjs/build
